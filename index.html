<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Демо-версии сайтов</title>
<style>
  :root { --bg: #f6f7f9; --fg: #14171c; --muted: #5d6673; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #eef1f5; --muted: #9aa4b2; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Демо-версии сайтов</h1>
  <p>Здесь размещаются демо-версии сайтов для клиентов. Ссылку на ваше демо вы получите в переписке.</p>
</main>
</body>
</html>
